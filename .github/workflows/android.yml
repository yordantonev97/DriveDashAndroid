name: Build DriveDash Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DriveDashAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        working-directory: .
        run: unzip -q DriveDashAndroid-v0.2.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test relay/test/relay.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DriveDash-Android-APK
          path: DriveDashAndroid/app/build/outputs/apk/debug/app-debug.apk
