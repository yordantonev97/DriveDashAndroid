name: DriveDash 3 Headunit experiment
on:
  push:
    branches: [drivedash-3-headunit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headunit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: andreknieriem/open-headunit
          ref: 7152adf13a1e5a55799da12f841c8016d1f5cfe0
          path: upstream
          persist-credentials: false
          lfs: true
      - name: Apply pinned experiment
        run: python3 headunit-experiment/apply.py upstream
      - name: Archive corresponding modified source
        run: tar --exclude=.git --exclude=.gradle --exclude=build -czf "${{ runner.temp }}/DriveDash3-headunit-source.tar.gz" -C upstream .
      - uses: actions/upload-artifact@v4
        with:
          name: DriveDash3-headunit-source
          path: ${{ runner.temp }}/DriveDash3-headunit-source.tar.gz
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build experimental APK
        working-directory: upstream
        run: chmod +x gradlew && ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DriveDash3-headunit-APK
          path: upstream/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
